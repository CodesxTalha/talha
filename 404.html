<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>404 — Talha.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gray: #828282;
            --text: #4c4c4c;
            --blue: #0a6cf0;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        html {
            -webkit-text-size-adjust: 100%
        }

        body {
            margin: 0;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            background: #fff;
            color: #000;
            font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-weight: 400;
            letter-spacing: -.03em;
            line-height: 1.3;
        }

        a {
            color: inherit;
            text-decoration: none
        }

        :focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px
        }

        .wrap {
            width: 100%;
            max-width: 1048px;
            margin: 0 auto;
            padding: 0 24px
        }

        
        /* Hero */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 48px 0;
        }

        .hero h1 {
            margin: 0;
            font-weight: 500;
            font-size: clamp(31px, 5vw, 50px);
            line-height: 1.26;
            letter-spacing: -1px
        }

        .hero h1 .g {
            color: var(--gray)
        }

        .hero h1 .b {
            color: var(--blue)
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 16px;
            color: var(--text);
            letter-spacing: -.02em;
            transition: opacity .2s ease;
        }

        .back-link:hover {
            opacity: .7
        }

        .back-link svg {
            width: 14px;
            height: 14px
        }


        /* Responsive */
        .br-d {
            display: inline
        }
    </style>
</head>

<body>


    <main>
        <section class="wrap hero">
            <h1>Page <span class="g">not</span> Found <span class="b">404</span><br class="br-d"> <span
                    class="g">wrong turn somewhere</span></h1>
            <a class="back-link" href="/">Back to homepage
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 13L13 3M5 3h8v8" />
                </svg>
            </a>
        </section>
    </main>


    <script>
        (function () {
            var dom = document.getElementById('domain'), host = location.hostname.replace(/^www\./, '');
            if (dom && /^([a-z0-9-]+\.)+[a-z]{2,}$/i.test(host)) dom.textContent = host;
        })();
    </script>
</body>

</html>
