<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact Talha — Available for web development, design, and automation projects.">
    <title>Contact — Talha.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <header>
        <div class="wrap nav">
            <a class="logo" href="/">Talha.</a>
            <div class="nav-right">
                <nav class="menu" id="menu" aria-label="Main">
                    <a href="about.html">About</a>
                    <a href="work.html" aria-current="page">Work</a>
                    <a href="contact.html">Contact</a>
                </nav>
                <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"
                    aria-controls="menu"><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main id="top">
        <!-- Hero -->
        <section class="wrap hero">
            <h1>Have <span class="g">an</span> Idea? <span class="b">Let’s Cook</span><br class="br-d"> <span
                    class="g">available for new projects</span></h1>
            <a class="mail" href="mailto:talhaxcodes@proton.me">talhaxcodes@proton.me
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 13L13 3M5 3h8v8" />
                </svg>
            </a>
        </section>

        <!-- Contact Form -->
        <section class="wrap contact-wrap">
            <form class="contact-form" id="contactForm">
                <div class="field-group">
                    <span class="small-label">What are we building?</span>
                    <div class="topic-pills" role="radiogroup" aria-label="Project type">
                        <label class="topic-pill">
                            <input type="radio" name="topic" value="Web Application" checked>
                            <span>web application</span>
                        </label>
                        <label class="topic-pill">
                            <input type="radio" name="topic" value="Interface Design">
                            <span>interface design</span>
                        </label>
                        <label class="topic-pill">
                            <input type="radio" name="topic" value="Process Automation">
                            <span>process automation</span>
                        </label>
                        <label class="topic-pill">
                            <input type="radio" name="topic" value="Something Else">
                            <span>something else</span>
                        </label>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label class="small-label" for="cName">Your name</label>
                        <input type="text" id="cName" name="name" placeholder="John Doe" required autocomplete="name">
                    </div>
                    <div class="field">
                        <label class="small-label" for="cEmail">Your email</label>
                        <input type="email" id="cEmail" name="email" placeholder="john@example.com" required
                            autocomplete="email">
                    </div>
                </div>

                <div class="field">
                    <label class="small-label" for="cMsg">Tell me about it</label>
                    <textarea id="cMsg" name="message" rows="6"
                        placeholder="Project goals, timeline, or anything you have in mind…" required></textarea>
                </div>

                <div class="form-foot">
                    <span class="form-note">Usually responds within 24 hours.</span>
                    <button class="send-wide" type="submit">
                        <span>Send message</span>
                        <svg width="20" height="20" viewBox="0 0 27 26" fill="none" xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true">
                            <path
                                d="M3.74337 12.6509L0.67059 4.13499C0.399339 1.69785 2.91116 -0.0924166 5.12977 0.958561L23.8571 9.82061C26.2482 10.9515 26.2482 14.3503 23.8571 15.4812L5.12977 24.3448C2.91116 25.3942 0.399339 23.6055 0.67059 21.1683L3.74337 12.6509ZM3.74337 12.6509H12.5931"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
                        </svg>
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="foot">
        <div class="wrap">
            <div class="foot-row">
                <a class="logo" href="/">Talha.</a>
                <nav class="foot-links" aria-label="Social"><a href="https://github.com/codesxtalha"
                        target="_blank">Github</a><a href="https://instagram.com/talhaxcodes"
                        target="_blank">Instagram</a></nav>
            </div>
            <div class="foot-row">
                <small>© 2026 <span id="domain">talha.hs.vc</span></small>
                <small>Made with &nbsp; ❤︎ &nbsp;by Talha.</small>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
